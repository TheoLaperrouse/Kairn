# Déploiement production sur un VPS : Kairn + Caddy (HTTPS automatique Let's Encrypt) + sauvegardes.
# Lancé par deploy/deploy.sh ; variables lues dans deploy/.env (DOMAIN, PUBLIC_URL, STRAVA_*…).
name: kairn

services:
  kairn:
    build:
      context: ..
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/kairn.db
    volumes:
      - kairn-data:/data
    restart: unless-stopped
    # Pas de port publié : seul Caddy est exposé.

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - kairn
    env_file: .env
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # Sauvegarde quotidienne cohérente de la base SQLite, 14 jours conservés.
  backup:
    image: alpine:3.22
    volumes:
      - kairn-data:/data:ro
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          if [ -f /data/kairn.db ]; then
            sqlite3 /data/kairn.db ".backup /backups/kairn-$$(date +%Y-%m-%d).db"
            find /backups -name 'kairn-*.db' -mtime +14 -delete
          fi
          sleep 86400
        done
    restart: unless-stopped

volumes:
  kairn-data:
  caddy-data:
  caddy-config:
