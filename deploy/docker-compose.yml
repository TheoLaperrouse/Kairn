# Production deployment on a VPS: Kairn + Caddy (automatic Let's Encrypt HTTPS) + backups.
# Started by deploy/deploy.sh; variables read from deploy/.env (DOMAIN, PUBLIC_URL, STRAVA_*…).
name: kairn

services:
  kairn:
    build:
      context: ..
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/kairn.db
    volumes:
      - kairn-data:/data
    restart: unless-stopped
    # No published port: only Caddy is exposed.

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - kairn
    env_file: .env
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # Consistent daily backup of the SQLite database, 14 days kept.
  backup:
    image: alpine:3.22
    volumes:
      - kairn-data:/data:ro
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          if [ -f /data/kairn.db ]; then
            sqlite3 /data/kairn.db ".backup /backups/kairn-$$(date +%Y-%m-%d).db"
            find /backups -name 'kairn-*.db' -mtime +14 -delete
          fi
          sleep 86400
        done
    restart: unless-stopped

volumes:
  kairn-data:
  caddy-data:
  caddy-config:
