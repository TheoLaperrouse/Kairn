# Deployment on a Raspberry Pi (64-bit Ubuntu): Kairn + Cloudflare Tunnel + backups.
# Started by deploy/pi/deploy.sh; variables read from .env (PUBLIC_URL, TUNNEL_TOKEN, STRAVA_*…).
# The tunnel only starts if .env contains COMPOSE_PROFILES=tunnel (written along with the token by deploy.sh).
# The kairn:latest image is built on the PC (ARM64) and loaded onto the Pi: nothing is compiled here.
name: kairn

services:
  kairn:
    image: kairn:latest
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/kairn.db
    volumes:
      - kairn-data:/data
    # Direct access on the local network (http://<pi-ip>:3100); Internet traffic goes through the tunnel.
    ports:
      - '${KAIRN_PORT:-3100}:3000'
    restart: unless-stopped

  # Outbound connection to Cloudflare, which serves https://<domain> and terminates HTTPS.
  # In the tunnel dashboard, the "Public hostname" points to http://kairn:3000.
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate run
    profiles:
      - tunnel
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - kairn
    restart: unless-stopped

  # Consistent daily backup of the SQLite database, 14 days kept.
  backup:
    image: alpine:3.22
    volumes:
      - kairn-data:/data:ro
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          if [ -f /data/kairn.db ]; then
            sqlite3 /data/kairn.db ".backup /backups/kairn-$$(date +%Y-%m-%d).db"
            find /backups -name 'kairn-*.db' -mtime +14 -delete
          fi
          sleep 86400
        done
    restart: unless-stopped

volumes:
  kairn-data:
