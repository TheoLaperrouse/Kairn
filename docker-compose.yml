services:
  kairn:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - kairn-data:/data
      # Uncomment for automatic import from a Garmin watch mounted over USB:
      # - /media/${USER}/GARMIN/GARMIN/Activity:/garmin:ro
      # And to send sessions to the watch (GARMIN_NEWFILES_DIR=/garmin-newfiles):
      # - /media/${USER}/GARMIN/GARMIN/NewFiles:/garmin-newfiles
    restart: unless-stopped

volumes:
  kairn-data:
